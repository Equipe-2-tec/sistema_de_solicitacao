<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunicados oficiais - Sistema de Registro</title><link rel="stylesheet" href="css/estilo.css">
<script src="js/app.js" defer></script>
</head>
<body data-page="messages">
<script>
document.addEventListener('DOMContentLoaded',()=>{
 if(!sessionStorage.getItem('sistemaSessao_v1')) return;
 const links=[['painel.html','Painel'],['mapa.html','Mapa da escola'],['registrar-ocorrencia.html','Registrar ocorrência'],['ocorrencias.html','Ocorrências'],['gestao.html','Gestão'],['relatorios.html','Relatórios'],['comunicados.html','Comunicados'],['historico.html','Histórico'],['atividades.html','Atividades']];
 const s=JSON.parse(sessionStorage.getItem('sistemaSessao_v1'));
 document.body.innerHTML=`<header class="top"><div class="brand">Sistema de Registro de Solicitações</div><div class="top-right"><span>${s.email} • ${s.sector}</span><button class="secondary small no-print" onclick="logout()">Sair</button></div></header><div class="layout"><nav class="sidebar"><div class="section-label">Menu principal</div>${links.map(([u,l])=>`<a class="${u==='comunicados.html'?'active':''}" href="${u}">${l}</a>`).join('')}</nav><main class="content"><h1>Comunicados oficiais</h1><p class="subtitle">Consulte avisos institucionais. Somente a gestão pode publicar e arquivar mensagens.</p>
<div class="card no-print"><h2>Publicar comunicado (somente gestão)</h2><form id="messageForm"><div class="field"><label for="messageTitle">Título</label><input id="messageTitle" required></div><div class="field"><label for="messageBody">Mensagem</label><textarea id="messageBody" required></textarea></div><button type="submit">Publicar comunicado</button></form></div>
<h2 style="margin-top:22px">Mural de comunicados</h2><div id="messageList"></div>
</main></div>`;
 });
</script>
</body></html>
