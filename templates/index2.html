
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acesso institucional - Sistema de Registro</title>

    <script src="static/app.js" defer></script>

    <style>
        /* =========================
           VARIÁVEIS
        ========================= */

        :root {
            --green: #16833b;
            --green-dark: #10652d;
            --green-light: #eaf6ee;

            --ink: #24312a;
            --muted: #6b776f;

            --line: #e4ebe6;
            --bg: #f5f8f6;

            --red: #c0392b;
            --orange: #d97706;
            --blue: #2563eb;
        }

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
        }

        a {
            color: var(--green);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* =========================
           BOTÕES
        ========================= */

        .button,
        .btn,
        button {
            border: none;
            border-radius: 8px;
            padding: 11px 15px;

            background: var(--green);
            color: #ffffff;

            font-weight: 600;
            font-size: 15px;

            cursor: pointer;
            display: inline-block;
            text-align: center;
            text-decoration: none;

            transition: background 0.2s ease;
        }

        .button:hover,
        .btn:hover,
        button:hover {
            background: var(--green-dark);
            text-decoration: none;
        }

        .btn.secondary,
        button.secondary {
            background: #e8efea;
            color: #285438;
        }

        .btn.danger,
        button.danger {
            background: var(--red);
        }

        .btn.warning,
        button.warning {
            background: var(--orange);
        }

        .btn.small,
        button.small {
            padding: 7px 10px;
            font-size: 13px;
        }

        /* =========================
           FORMULÁRIOS
        ========================= */

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;

            border: 1px solid var(--line);
            border-radius: 8px;

            background: #ffffff;
            color: var(--ink);

            font-size: 15px;
            outline: none;

            transition: border 0.2s, box-shadow 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(22, 131, 59, 0.12);
        }

        input::placeholder {
            color: #9aa49d;
        }

        /* =========================
           LOGIN
        ========================= */

        .login-page {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;

            background: #ffffff;

            padding: 35px;

            border: 1px solid var(--line);
            border-radius: 15px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .login-box h1 {
            font-size: 27px;
            margin-bottom: 10px;
            color: var(--ink);
        }

        .login-box > p {
            margin-bottom: 25px;
        }

        .muted {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        /* BOTÃO DE LOGIN */

        .login-box .button,
        .login-box .btn,
        .login-box button {
            width: 100%;
            margin-top: 5px;
        }

        /* =========================
           LINKS DO LOGIN
        ========================= */

        .login-links {
            display: flex;
            flex-direction: column;

            gap: 12px;

            margin-top: 20px;

            text-align: center;
        }

        .login-links a {
            font-size: 14px;
        }

        /* =========================
           MENSAGENS
        ========================= */

        #loginMsg {
            margin-top: 12px;
            font-size: 14px;
        }

        /* =========================
           AVISOS
        ========================= */

        .notice {
            padding: 14px;

            margin-top: 22px;

            border-radius: 8px;

            background: var(--green-light);
            border: 1px solid #d2ead8;

            color: #285438;

            font-size: 13px;
            line-height: 1.6;
        }

        .notice strong {
            display: block;
            margin-bottom: 5px;
        }

        .notice p {
            margin-top: 4px;
        }

        .notice.warn {
            background: #fff7e8;
            border-color: #f5dfb5;
            color: #8a5708;
        }

        /* =========================
           RODAPÉ
        ========================= */

        .footer-note {
            text-align: center;

            margin-top: 22px;

            font-size: 12px;
            color: var(--muted);
        }

        /* =========================
           RESPONSIVIDADE
        ========================= */

        @media (max-width: 650px) {

            .login-page {
                padding: 15px;
            }

            .login-box {
                padding: 25px 20px;
            }

            .login-box h1 {
                font-size: 23px;
            }
        }

        /* =========================
           ANIMAÇÃO
        ========================= */

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-box {
            animation: aparecer 0.35s ease;
        }

    </style>
</head>

<body data-page="login">

    <!-- =========================
         PÁGINA DE LOGIN
    ========================= -->

    <main class="login-page">

        <section class="login-box">

            <h1>Acesso institucional</h1>

            <p class="muted">
                Entre com suas credenciais para acessar o sistema.
            </p>

            <!-- FORMULÁRIO -->

            <form id="loginForm">

                <!-- E-MAIL -->

                <div class="field">

                    <label for="email">
                        E-mail institucional
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="username"
                        required
                    >

                </div>

                <!-- SENHA -->

                <div class="field">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <!-- SETOR -->

                <div class="field">

                    <label for="setor">
                        Setor
                    </label>

                    <select id="setor" required>

                        <option value="">
                            Selecione seu setor
                        </option>

                        <option value="Secretaria">
                            Secretaria
                        </option>

                        <option value="Gestão">
                            Gestão
                        </option>

                    </select>

                </div>

                <!-- BOTÃO CORRETAMENTE INSERIDO -->

                <button
                    type="submit"
                    class="button"
                    id="button"
                >
                    Entrar no sistema
                </button>

                <!-- MENSAGEM DO JAVASCRIPT -->

                <p id="loginMsg"></p>

            </form>

            <!-- LINKS -->

            <div class="login-links">

                <a href="#" id="recovery">
                    Esqueci minha senha
                </a>

                <a href="registro.html">
                    Criar cadastro institucional
                </a>

            </div>

            <!-- CONTA DE DEMONSTRAÇÃO -->

            <div class="notice">

                <strong>Conta de demonstração</strong>

                <p>
                    E-mail: secretaria@escola.com
                </p>

                <p>
                    Senha: Escola123!
                </p>

            </div>

            <!-- RODAPÉ -->

            <p class="footer-note">
                Sistema de registro de solicitações
            </p>

        </section>

    </main>

</body>
</html>
