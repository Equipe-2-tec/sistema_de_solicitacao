<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa da escola - Sistema de Registro</title><link rel="stylesheet" href="css/estilo.css">
<script src="js/app.js" defer></script>
</head>
<body data-page="map">
<script>
document.addEventListener('DOMContentLoaded',()=>{
 if(!sessionStorage.getItem('sistemaSessao_v1')) return;
 const links=[['painel.html','Painel'],['mapa.html','Mapa da escola'],['registrar-ocorrencia.html','Registrar ocorrência'],['ocorrencias.html','Ocorrências'],['gestao.html','Gestão'],['relatorios.html','Relatórios'],['comunicados.html','Comunicados'],['historico.html','Histórico'],['atividades.html','Atividades']];
 const s=JSON.parse(sessionStorage.getItem('sistemaSessao_v1'));
 document.body.innerHTML=`<header class="top"><div class="brand">Sistema de Registro de Solicitações</div><div class="top-right"><span>${s.email} • ${s.sector}</span><button class="secondary small no-print" onclick="logout()">Sair</button></div></header><div class="layout"><nav class="sidebar"><div class="section-label">Menu principal</div>${links.map(([u,l])=>`<a class="${u==='mapa.html'?'active':''}" href="${u}">${l}</a>`).join('')}</nav><main class="content"><h1>Mapa da escola</h1><p class="subtitle">Selecione um ambiente para registrar uma ocorrência. Ambientes com problemas não resolvidos ficam destacados.</p>
<div class="legend"><span><i class="dot"></i> Sem pendência</span><span><i class="dot red"></i> Possui ocorrência não resolvida</span></div>
<div class="card"><h2>Ambientes da instituição</h2><p class="muted">O mapa abaixo é uma representação inicial dos espaços. Selecione um ambiente para abrir o formulário de ocorrência.</p><div id="schoolMap" class="school-map"></div></div>
<div class="notice">A disposição é ilustrativa e pode ser adaptada para corresponder à planta real da escola.</div>
</main></div>`;
 });
</script>
</body></html>
