<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Registro de Solicitações</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #ffffff;
    min-height: 100vh;
}

header {
    background: white;
    padding: 25px 8%;
    border-bottom: 1px solid #e0e0e0;
}

header h1 {
    color: #16833b;
    font-size: 27px;
}

main {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: 30px 20px;
}

.container {
    background: white;
    width: 850px;
    max-width: 100%;
    display: flex;
    border-radius: 8px;
    box-shadow: 0 3px 18px #00000012;
    overflow: hidden;
}

.opcoes, .login {
    width: 50%;
    padding: 55px 40px;
}

.opcoes {
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.login {
    border-left: 1px solid #eeeeee;
    display: none;
}

h2 {
    color: #16833b;
    margin-bottom: 15px;
    font-size: 25px;
}

p {
    color: #777777;
    margin-bottom: 25px;
    line-height: 1.5;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #444444;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border: 1px solid #cccccc;
    border-radius: 4px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #16833b;
}

button, .botao {
    display: block;
    width: 100%;
    padding: 14px;
    background: #16833b;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
    text-decoration: none;
    text-align: center;
}

button:hover, .botao:hover {
    background: #10652d;
}

.opcoes .botao {
    margin-bottom: 15px;
}

.link-recuperacao {
    display: block;
    text-align: right;
    margin-top: -10px;
    margin-bottom: 20px;
    color: #16833b;
    font-size: 14px;
    text-decoration: none;
}

.link-recuperacao:hover {
    text-decoration: underline;
}

.voltar {
    display: block;
    margin-top: 20px;
    text-align: center;
    color: #16833b;
    text-decoration: none;
    font-size: 14px;
}

@media (max-width: 650px) {
    .container {
        flex-direction: column;
    }

    .opcoes, .login {
        width: 100%;
        padding: 35px 25px;
    }

    .login {
        border-left: none;
        border-top: 1px solid #eeeeee;
    }

    header h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Sistema de Registro de Solicitações</h1>
</header>

<main>

<div class="container">

    <!-- TELA INICIAL -->
    <section class="opcoes" id="telaInicial">

        <h2>Bem-vindo!</h2>

        <p>
            Acesse o sistema institucional para acompanhar
            e gerenciar as solicitações da escola.
        </p>

        <a href="index.html" class="botao">
            Criar conta institucional
        </a>

        <button type="button" onclick="mostrarLogin()">
            Já tenho uma conta
        </button>

    </section>

    <!-- TELA DE LOGIN -->
    <section class="login" id="telaLogin">

        <h2>Login institucional</h2>

        <p>
            Informe suas credenciais institucionais
            para acessar o sistema.
        </p>

        <form id="loginForm">

            <label for="email">E-mail institucional</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail institucional"
                autocomplete="username"
                required
            >

            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
            >

            <a href="#" class="link-recuperacao"
               onclick="recuperarSenha(event)">
                Esqueci minha senha
            </a>

            <button type="submit">
                Entrar no sistema
            </button>

        </form>

        <a href="#" class="voltar" onclick="voltarInicio(event)">
            Voltar para a tela inicial
        </a>

    </section>

</div>

</main>

<script>

// Mostrar a tela de login
function mostrarLogin() {
    document.getElementById("telaInicial").style.display = "none";
    document.getElementById("telaLogin").style.display = "block";
}

// Voltar para a tela inicial
function voltarInicio(event) {
    event.preventDefault();

    document.getElementById("telaLogin").style.display = "none";
    document.getElementById("telaInicial").style.display = "flex";
}

// Recuperação de senha
function recuperarSenha(event) {
    event.preventDefault();

    alert("A recuperação de senha deverá ser realizada através do e-mail institucional cadastrado.");
}

// Carrega o JavaScript do sistema
</script>

<script src="/static/script.js"></script>

</body>
</html>
