<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de ocorrências - Sistema de Registro</title><link rel="stylesheet" href="css/estilo.css">
<script src="js/app.js" defer></script>
</head>
<body data-page="management">
<script>
document.addEventListener('DOMContentLoaded',()=>{
 if(!sessionStorage.getItem('sistemaSessao_v1')) return;
 const links=[['painel.html','Painel'],['mapa.html','Mapa da escola'],['registrar-ocorrencia.html','Registrar ocorrência'],['ocorrencias.html','Ocorrências'],['gestao.html','Gestão'],['relatorios.html','Relatórios'],['comunicados.html','Comunicados'],['historico.html','Histórico'],['atividades.html','Atividades']];
 const s=JSON.parse(sessionStorage.getItem('sistemaSessao_v1'));
 document.body.innerHTML=`<header class="top"><div class="brand">Sistema de Registro de Solicitações</div><div class="top-right"><span>${s.email} • ${s.sector}</span><button class="secondary small no-print" onclick="logout()">Sair</button></div></header><div class="layout"><nav class="sidebar"><div class="section-label">Menu principal</div>${links.map(([u,l])=>`<a class="${u==='gestao.html'?'active':''}" href="${u}">${l}</a>`).join('')}</nav><main class="content"><h1>Gestão de ocorrências</h1><p class="subtitle">Analise os problemas, defina prioridades, registre providências e atualize a situação.</p>
<div class="notice warn">Área de gestão: defina prioridade e situação de cada ocorrência. A seleção de setor no login é demonstrativa; permissões reais precisam ser controladas pelo servidor.</div>
<div id="managementList"></div>
</main></div>`;
 });
</script>
</body></html>
