
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel principal - Sistema de Registro</title>

    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/app.js" defer></script>
</head>

<body data-page="dashboard">

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // Verifica se existe uma sessão ativa
            if (!sessionStorage.getItem('sistemaSessao_v1')) {
    document.body.innerHTML = `
        <main style="padding:30px;text-align:center;font-family:Arial">
            <h1>Acesso não autorizado</h1>
            <p>Você precisa fazer login para acessar o painel.</p>
            <a href="/login">Voltar para o login</a>
        </main>
    `;
    return;
            }
            }

            // Links do menu principal
            const links = [
                ['painel.html', 'Painel'],
                ['mapa.html', 'Mapa da escola'],
                ['registrar-ocorrencia.html', 'Registrar ocorrência'],
                ['ocorrencias.html', 'Ocorrências'],
                ['gestao.html', 'Gestão'],
                ['relatorios.html', 'Relatórios'],
                ['comunicados.html', 'Comunicados'],
                ['historico.html', 'Histórico'],
                ['atividades.html', 'Atividades']
            ];

            // Recupera os dados da sessão
            const s = JSON.parse(
                sessionStorage.getItem('sistemaSessao_v1')
            );

            // Montagem do menu lateral
            const menu = links.map(([url, nome]) => {

                const ativo = url === 'painel.html'
                    ? 'active'
                    : '';

                return `
                    <a class="${ativo}" href="${url}">
                        ${nome}
                    </a>
                `;

            }).join('');

            // Montagem da estrutura principal
            document.body.innerHTML = `

                <!-- Cabeçalho -->
                <header class="top">

                    <div class="brand">
                        Sistema de Registro de Solicitações
                    </div>

                    <div class="top-right">

                        <span>
                            ${s.email} • ${s.sector}
                        </span>

                        <button
                            class="secondary small no-print"
                            onclick="logout()"
                        >
                            Sair
                        </button>

                    </div>

                </header>


                <!-- Estrutura do sistema -->
                <div class="layout">

                    <!-- Menu lateral -->
                    <nav class="sidebar">

                        <div class="section-label">
                            Menu principal
                        </div>

                        ${menu}

                    </nav>


                    <!-- Conteúdo principal -->
                    <main class="content">

                        <h1>Painel principal</h1>

                        <p class="subtitle">
                            Acompanhe os registros e acesse
                            as ferramentas da instituição.
                        </p>


                        <!-- Indicadores -->
                        <div class="grid">

                            <div class="card">
                                <div class="stat" id="totalStat">
                                    —
                                </div>

                                <div class="stat-label">
                                    Total de ocorrências
                                </div>
                            </div>


                            <div class="card">
                                <div class="stat" id="pendingStat">
                                    —
                                </div>

                                <div class="stat-label">
                                    Pendentes
                                </div>
                            </div>


                            <div class="card">
                                <div class="stat" id="progressStat">
                                    —
                                </div>

                                <div class="stat-label">
                                    Em andamento
                                </div>
                            </div>


                            <div class="card">
                                <div class="stat" id="resolvedStat">
                                    —
                                </div>

                                <div class="stat-label">
                                    Resolvidas
                                </div>
                            </div>

                        </div>


                        <!-- Cards de informações -->
                        <div class="cards-2">


                            <!-- Acesso rápido -->
                            <section class="card">

                                <h2>Acesso rápido</h2>

                                <div class="actions">

                                    <a
                                        class="btn"
                                        href="registrar-ocorrencia.html"
                                    >
                                        Registrar ocorrência
                                    </a>

                                    <a
                                        class="btn secondary"
                                        href="mapa.html"
                                    >
                                        Ver mapa da escola
                                    </a>

                                    <a
                                        class="btn secondary"
                                        href="ocorrencias.html"
                                    >
                                        Consultar ocorrências
                                    </a>

                                </div>

                            </section>


                            <!-- Orientações -->
                            <section class="card">

                                <h2>Orientações</h2>

                                <p class="muted">
                                    A secretaria pode registrar e encaminhar
                                    problemas. A gestão pode analisar,
                                    definir prioridades, atualizar situações
                                    e publicar comunicados oficiais.
                                </p>

                                <div class="notice">

                                    As operações realizadas ficam
                                    registradas no histórico de atividades
                                    deste protótipo.

                                </div>

                            </section>


                        </div>

                    </main>

                </div>

            `;

        });
    </script>

</body>
</html>
