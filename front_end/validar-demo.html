<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validação demonstrativa</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="index2.html">Sistema de Registro de Solicitações</a></header>
<main class="auth"><section class="card"><h1>Validação institucional</h1>
<div class="notice warn">Esta tela existe exclusivamente para demonstrar o fluxo do trabalho escolar. Ela não substitui uma validação real por uma autoridade da instituição.</div>
<p id="demoInfo" class="sub"></p><button id="approve">Simular aprovação do cadastro</button>
<p id="demoMsg" class="muted"></p><a class="btn secondary" href="index2.html">Ir para o login</a></section></main>
<script src="script.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{
 const a=JSON.parse(localStorage.getItem('srsi_account')||'null');
 document.getElementById('demoInfo').textContent=a?'Instituição cadastrada: '+a.school+' • Status atual: '+a.status:'Nenhum cadastro institucional foi encontrado neste navegador.';
 document.getElementById('approve').onclick=()=>{
  const account=JSON.parse(localStorage.getItem('srsi_account')||'null');
  if(!account){document.getElementById('demoMsg').textContent='Cadastre a instituição primeiro.';return;}
  account.status='aprovada';localStorage.setItem('srsi_account',JSON.stringify(account));
  const logs=JSON.parse(localStorage.getItem('srsi_logs')||'[]');
  logs.unshift({date:new Date().toISOString(),sector:'Validação institucional (demonstração)',action:'Cadastro institucional aprovado para teste'});
  localStorage.setItem('srsi_logs',JSON.stringify(logs));
  document.getElementById('demoMsg').textContent='Aprovação simulada. Agora você pode entrar usando o e-mail e a senha cadastrados.';
  document.getElementById('demoInfo').textContent='Instituição: '+account.school+' • Status: aprovada (simulação)';
 };
});
</script></body></html>
