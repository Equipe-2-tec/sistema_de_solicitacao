<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro institucional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a class="brand" href="index2.html">Sistema de Registro de Solicitações</a>
</header>

<main class="auth">
    <section class="card">

        <h1>Criar conta institucional</h1>

        <p class="sub">Preencha os dados para cadastrar sua instituição.</p>

        <div class="notice">
            Após concluir o cadastro, você será direcionado
            automaticamente para o painel.
        </div>

        <form id="registerForm">

            <label for="school">Nome da escola</label>
            <input id="school" required placeholder="Nome completo da instituição">

            <label for="regEmail">E-mail institucional</label>
            <input id="regEmail" type="email" required placeholder="E-mail institucional">

            <label for="owner">Nome do responsável</label>
            <input id="owner" required placeholder="Nome do responsável">

            <label for="regPass">Senha</label>
            <input id="regPass" type="password" minlength="8" required placeholder="Mínimo de 8 caracteres">

            <label for="regConfirm">Confirmação da senha</label>
            <input id="regConfirm" type="password" minlength="8" required placeholder="Repita a senha">

            <button type="submit">Criar conta e acessar painel</button>

            <p id="registerMsg" class="muted"></p>

        </form>

        <a class="btn secondary" href="index2.html">Voltar para a página inicial</a>
    </section>
</main>

<script src="script.js"></script>


</body>
</html>
