<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro institucional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a class="brand" href="index2.html">Sistema de Registro de Solicitações</a>
</header>

<main class="auth">
    <section class="card">

        <h1>Criar conta institucional</h1>

        <p class="sub">Preencha os dados para cadastrar sua instituição.</p>

        <div class="notice">
            Após concluir o cadastro, você será direcionado
            automaticamente para o painel.
        </div>

        <form id="registerForm">

            <label for="school">Nome da escola</label>
            <input id="school" required placeholder="Nome completo da instituição">

            <label for="regEmail">E-mail institucional</label>
            <input id="regEmail" type="email" required placeholder="E-mail institucional">

            <label for="owner">Nome do responsável</label>
            <input id="owner" required placeholder="Nome do responsável">

            <label for="regPass">Senha</label>
            <input id="regPass" type="password" minlength="8" required placeholder="Mínimo de 8 caracteres">

            <label for="regConfirm">Confirmação da senha</label>
            <input id="regConfirm" type="password" minlength="8" required placeholder="Repita a senha">

            <button type="submit">Criar conta e acessar painel</button>

            <p id="registerMsg" class="muted"></p>

        </form>

        <a class="btn secondary" href="index2.html">Voltar para a página inicial</a>
    </section>
</main>

<script src="script.js"></script>

<script>
document.getElementById("registerForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const school  = document.getElementById("school").value.trim();
    const email   = document.getElementById("regEmail").value.trim();
    const owner   = document.getElementById("owner").value.trim();
    const pass    = document.getElementById("regPass").value;
    const confirm = document.getElementById("regConfirm").value;
    const msg     = document.getElementById("registerMsg");

    msg.textContent = "";

    if (pass !== confirm) {
        msg.textContent = "As senhas não são iguais.";
        return;
    }

    // 1) Sempre salva localmente (funciona mesmo se o backend estiver offline)
    const account = { school, email, owner, password: pass };
    localStorage.setItem("institutionAccount", JSON.stringify(account));
    localStorage.setItem("institutionLoggedIn", "true");

    // 2) Tenta registrar no backend (não bloqueia o login se falhar)
    try {
        const response = await fetch("/api/cadastro", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nome: school, email: email, senha: pass })
        });
        const data = await response.json().catch(() => ({}));
        if (response.ok) {
            console.info("Backend:", data.mensagem || "Cadastro registrado.");
        } else {
            console.warn("Backend recusou:", data.erro || response.status);
        }
    } catch (e) {
        console.warn("Backend indisponível, seguindo apenas com localStorage:", e.message);
    }

    window.location.href = "painel.html";
});
</script>

</body>
</html>
