<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro institucional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a class="brand" href="index2.html">
        Sistema de Registro de Solicitações
    </a>
</header>

<main class="auth">
    <section class="card">

        <h1>Criar conta institucional</h1>

        <p class="sub">
            Preencha os dados da instituição e confirme sua conta Gmail.
        </p>

        <div class="notice">
            O Google confirmará que a conta existe. Sua senha do Gmail não é enviada para este site.
        </div>

        <form id="registerForm">

            <label for="school">Nome da escola</label>
            <input id="school" maxlength="150" required
                placeholder="Nome completo da instituição">

            <label for="owner">Nome do responsável</label>
            <input id="owner" maxlength="150" required
                placeholder="Nome do responsável">

            <div id="googleRegisterButton" class="google-button"></div>

            <p id="registerMsg" class="muted" role="status"></p>

        </form>

        <a class="btn secondary" href="index2.html">
            Voltar para a página inicial
        </a>

    </section>
</main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="script.js"></script>


</body>
</html>
