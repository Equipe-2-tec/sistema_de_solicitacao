<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro institucional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a class="brand" href="index2.html">
        Sistema de Registro de Solicitações
    </a>
</header>

<main class="auth">
    <section class="card">

        <h1>Criar conta institucional</h1>

        <p class="sub">
            Preencha os dados para cadastrar sua instituição.
        </p>

        <div class="notice">
            Confirme o acesso à sua caixa de e-mail para concluir o cadastro.
        </div>

        <form id="registerForm">

            <label for="school">Nome da escola</label>
            <input id="school" maxlength="150" required
                placeholder="Nome completo da instituição">

            <label for="regEmail">E-mail institucional</label>
            <input id="regEmail" type="email" maxlength="150" required
                placeholder="E-mail institucional">

            <label for="owner">Nome do responsável</label>
            <input id="owner" required
                placeholder="Nome do responsável">

            <label for="regPass">Senha</label>
            <input id="regPass" type="password"
                minlength="8" maxlength="128" required
                placeholder="Mínimo de 8 caracteres">

            <label for="regConfirm">Confirmação da senha</label>
            <input id="regConfirm" type="password"
                minlength="8" maxlength="128" required
                placeholder="Repita a senha">

            <button type="button" id="sendEmailCode">Enviar código por e-mail</button>

            <label for="emailCode">Código de confirmação</label>
            <input id="emailCode" required maxlength="512" autocomplete="one-time-code"
                autocapitalize="off" spellcheck="false">

            <button type="submit" id="btnSubmit">Confirmar código e criar conta</button>

            <p id="registerMsg" class="muted" role="status"></p>

        </form>

        <a class="btn secondary" href="index2.html">
            Voltar para a página inicial
        </a>

    </section>
</main>

<script src="script.js"></script>


</body>
</html>
